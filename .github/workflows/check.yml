name: Pokemon Monitor - 6 Sites
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install cheerio node-fetch@2
      - run: node monitor.js
